name: Security rules tests

# Runs the Firestore + Storage security-rules tests (tests/rules) against the
# local emulators whenever the rules or the tests change. Uses a demo- project
# id, so it needs no secrets and never touches the real database.
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'storage.rules', 'tests/rules/**', '.github/workflows/rules-tests.yml']
  pull_request:
    paths: ['firestore.rules', 'storage.rules', 'tests/rules/**', '.github/workflows/rules-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java (for the emulators)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Run rules tests
        run: npm run test:rules
